<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Split — Training Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div class="eyebrow">Weekly Split</div>
      <h1 id="dayFull" class="day-full"></h1>
      <div id="dayFocus" class="day-focus"></div>

      <div class="swap-row">
        <label for="swapSelect" class="swap-label">Swap with</label>
        <select id="swapSelect" class="swap-select">
          <option value="">Swap with…</option>
        </select>
        <button id="swapReset" class="swap-reset">reset week order</button>
      </div>
    </header>

    <nav id="dayTabs" class="day-tabs"></nav>

    <div class="export-bar">
      <span class="export-label">Export</span>
      <input type="date" id="exportFrom" class="export-date">
      <span class="export-sep">to</span>
      <input type="date" id="exportTo" class="export-date">
      <button id="exportBtn" class="export-btn">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        CSV
      </button>
    </div>

    <div id="progressWrap" class="progress-wrap">
      <div class="progress-row">
        <span id="progressLabel" class="progress-label"></span>
        <button id="resetBtn" class="reset-btn">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          reset
        </button>
      </div>
      <div class="progress-bar-track">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
    </div>

    <div id="restDay" class="rest-day">
      <div class="rest-day-circle"><div class="rest-day-dot"></div></div>
      <div class="rest-day-title">Rest Day</div>
      <div class="rest-day-sub">Clinic day — recovery, not training.</div>
    </div>

    <div id="exercises" class="exercises"></div>

    <div id="restBanner" class="rest-banner">
      <div class="rest-banner-inner-wrap">
        <div class="rest-banner-left">
          <div class="rest-banner-timer"><span id="restTime">02:00</span></div>
          <div>
            <div class="rest-banner-title">Resting</div>
            <div class="rest-banner-sub">Next set coming up</div>
          </div>
        </div>
        <button id="restDismiss" class="rest-dismiss">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
