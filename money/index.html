<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authGate" class="auth-gate"></div>
  <div class="app" id="app-content" style="display:none">
    <header>
      <h1>Money</h1>
      <p class="subtitle" id="dashboard-subtitle"></p>
    </header>

    <div class="tab-panels">
      <section id="tab-dashboard" class="tab-panel">
        <section class="hero-panel">
          <div class="hero-top">
            <div>
              <div class="hero-label">Total Investments</div>
              <div class="hero-value" id="dash-total-investments">$0</div>
            </div>
          </div>
          <p class="hint" id="dash-investments-hint"></p>
        </section>

        <div class="stat-row">
          <div class="stat-tile">
            <div class="stat-label">Spent this month</div>
            <div class="stat-value" id="dash-spent">$0</div>
            <div class="progress-track">
              <div class="progress-fill" id="dash-budget-fill"></div>
            </div>
            <div class="stat-sub" id="dash-budget-sub"></div>
          </div>
          <div class="stat-tile">
            <div class="stat-label">Monthly contributions</div>
            <div class="stat-value" id="dash-contrib">$0</div>
            <div class="stat-sub" id="dash-contrib-sub"></div>
          </div>
        </div>

        <section class="cards-panel">
          <div class="panel-heading">
            <h2>Cards</h2>
          </div>
          <div id="dash-cards-list" class="cards-list"></div>
        </section>

        <p class="dash-refresh-hint">
          Pulled from your Spending and Investments data — switch tabs below to edit either.
          <button type="button" id="dash-refresh-btn" class="link-btn">Refresh</button>
        </p>
      </section>

      <section id="tab-spending" class="tab-panel hidden iframe-panel">
        <iframe id="spending-frame" src="../expense-tracker/index.html" title="Spending" loading="eager"></iframe>
      </section>

      <section id="tab-investments" class="tab-panel hidden iframe-panel">
        <iframe id="investments-frame" src="../investment-planner/index.html" title="Investments" loading="eager"></iframe>
      </section>
    </div>

    <nav class="tab-bar">
      <button type="button" class="tab-bar-btn active" data-tab="dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 20V13M12 20V6M20 20V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Dashboard</span>
      </button>
      <button type="button" class="tab-bar-btn" data-tab="spending">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="20" r="1.4" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="20" r="1.4" stroke="currentColor" stroke-width="1.6"/><path d="M2 4H4.5L6.5 15H18L20.5 6H5.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Spending</span>
      </button>
      <button type="button" class="tab-bar-btn" data-tab="investments">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 17L9.5 10L14 14.5L21 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 6H21V11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Investments</span>
      </button>
    </nav>
  </div>

  <script src="../shared/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/supabase-sync.js"></script>
  <script src="script.js"></script>
</body>
</html>
