<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Willow — Consult Templates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authGate" class="auth-gate"></div>
  <div id="app" class="app" style="display:none">
    <header class="header">
      <div class="eyebrow">Willow</div>
      <h1 class="page-title">Consult Templates</h1>
      <div id="modeToggle" class="mode-toggle">
        <button class="mode-btn" type="button" data-mode="clinic">In-Clinic</button>
        <button class="mode-btn" type="button" data-mode="tele">Teleconsult</button>
      </div>
      <div id="searchBox" class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
          <line x1="16.3" y1="16.3" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search conditions…" autocomplete="off">
        <button id="clearSearchBtn" class="clear-search-btn hidden" type="button" aria-label="Clear search">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="listView" class="list-view">
      <div class="list-scroll">
        <div id="listMeta" class="list-meta"></div>
        <div id="listRows" class="list-rows"></div>
      </div>
      <div class="bottom-search-bar">
        <div id="searchBoxBottom" class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <line x1="16.3" y1="16.3" x2="21" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="searchInputBottom" type="text" placeholder="Search conditions…" autocomplete="off">
          <button id="clearSearchBtnBottom" class="clear-search-btn hidden" type="button" aria-label="Clear search">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
              <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="detailView" class="detail-view hidden">
      <div class="detail-header">
        <div class="detail-header-top">
          <button id="backBtn" class="back-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
          </button>
          <button id="copyBtnTop" class="copy-btn-top" type="button">
            <svg id="copyIconTop" width="15" height="15" viewBox="0 0 24 24" fill="none">
              <rect x="8" y="8" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M15 8V6.5A1.5 1.5 0 0013.5 5h-8A1.5 1.5 0 004 6.5v9A1.5 1.5 0 005.5 17H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="copyLabelTop">Copy</span>
          </button>
        </div>
        <div class="detail-title-row">
          <div>
            <div id="detailCategory" class="detail-category"></div>
            <h2 id="detailTitle" class="detail-title"></h2>
          </div>
          <button id="starBtn" class="star-btn" type="button" aria-label="Star this template">
            <svg id="starIcon" width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 3.5l2.55 5.6 6.15.65-4.6 4.2 1.25 6.05L12 16.9l-5.35 3.1 1.25-6.05-4.6-4.2 6.15-.65z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="detail-body-wrap">
        <div id="detailBody" class="detail-body"></div>
      </div>
      <div class="copy-bar">
        <button id="copyBtn" class="copy-btn" type="button">
          <svg id="copyIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="8" y="8" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M15 8V6.5A1.5 1.5 0 0013.5 5h-8A1.5 1.5 0 004 6.5v9A1.5 1.5 0 005.5 17H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="copyLabel">Copy template</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../shared/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/supabase-sync.js"></script>
  <script src="script.js"></script>
</body>
</html>
