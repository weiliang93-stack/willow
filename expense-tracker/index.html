<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authGate" class="auth-gate"></div>
  <div class="app" id="app-content" style="display:none">
    <header>
      <h1>Budget Tracker</h1>
      <p class="subtitle" id="month-label"></p>
    </header>

    <section class="expense-panel">
      <h2>Add expense</h2>
      <form id="add-expense-form" class="expense-form">
        <input id="expense-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount ($)" required>
        <select id="expense-category" required>
          <option value="" disabled selected>Category</option>
        </select>
        <select id="expense-card" required>
          <option value="" disabled selected>Payment method</option>
          <option value="cash">Cash / Other</option>
        </select>
        <input id="expense-date" type="date" required>
        <input id="expense-note" type="text" placeholder="Note (optional)">
        <button type="submit">Add expense</button>
      </form>
    </section>

    <section class="budget-panel">
      <div class="panel-heading">
        <h2>Monthly Budget</h2>
        <button id="edit-budget-btn" class="link-btn">Edit</button>
      </div>
      <div id="budget-display"></div>

      <form id="edit-budget-form" class="inline-form hidden">
        <input id="budget-input" type="number" min="0" step="0.01" placeholder="Monthly budget ($)" required>
        <div class="form-actions">
          <button type="submit">Save</button>
          <button type="button" id="cancel-budget-btn" class="secondary">Cancel</button>
        </div>
      </form>
    </section>

    <section class="card-panel">
      <div class="panel-heading">
        <h2>Cards</h2>
        <button id="add-card-btn" class="link-btn">+ Add card</button>
      </div>
      <div id="cards-list" class="cards-list"></div>

      <form id="add-card-form" class="inline-form hidden">
        <input id="card-name" type="text" placeholder="Card name (e.g. Amex)" required>
        <input id="card-cap" type="number" min="0" step="0.01" placeholder="Monthly cap ($)" required>
        <div class="radio-group">
          <label><input type="radio" name="card-reset-mode" value="calendar" checked> Resets calendar month</label>
          <label><input type="radio" name="card-reset-mode" value="statement"> Resets on statement date</label>
        </div>
        <input id="card-statement-day" type="number" min="1" max="31" placeholder="Statement day (1-31)" class="hidden">
        <div class="form-actions">
          <button type="submit">Save card</button>
          <button type="button" id="cancel-card-btn" class="secondary">Cancel</button>
        </div>
      </form>
    </section>

    <section class="category-panel">
      <div class="panel-heading">
        <h2>Categories</h2>
        <button id="add-category-btn" class="link-btn">+ Add category</button>
      </div>
      <div id="categories-list" class="categories-list"></div>

      <form id="add-category-form" class="inline-form hidden">
        <input id="category-name" type="text" placeholder="Category name (e.g. Travel)" required>
        <div class="form-actions">
          <button type="submit">Save category</button>
          <button type="button" id="cancel-category-btn" class="secondary">Cancel</button>
        </div>
      </form>
    </section>

    <section class="chart-panel">
      <div class="panel-heading">
        <h2>Spending by Category</h2>
      </div>
      <div id="category-chart" class="category-chart"></div>
    </section>

    <section class="history-panel">
      <div class="panel-heading">
        <h2>This month's expenses</h2>
        <span id="month-total" class="month-total"></span>
      </div>
      <div id="expense-list" class="expense-list"></div>
      <button id="export-csv-btn" class="secondary export-btn" type="button">Export all expenses as CSV</button>
    </section>

    <section class="search-panel">
      <div class="panel-heading">
        <h2>Search Expenses</h2>
        <button type="button" id="clear-search-btn" class="link-btn">Clear</button>
      </div>
      <div class="search-form">
        <input id="search-text" type="text" placeholder="Search notes...">
        <select id="search-category">
          <option value="">All categories</option>
        </select>
        <div class="date-range">
          <input id="search-date-from" type="date" aria-label="From date">
          <span>to</span>
          <input id="search-date-to" type="date" aria-label="To date">
        </div>
        <div class="quick-filters">
          <button type="button" id="filter-this-month-btn" class="secondary">This month</button>
          <button type="button" id="filter-last-month-btn" class="secondary">Last month</button>
        </div>
      </div>
      <div class="panel-heading">
        <span id="search-result-summary" class="hint"></span>
        <span id="search-total" class="month-total"></span>
      </div>
      <div id="search-results" class="expense-list"></div>
      <button id="export-search-csv-btn" class="secondary export-btn" type="button">Export this period as CSV</button>
    </section>
  </div>

  <script src="../shared/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/supabase-sync.js"></script>
  <script src="script.js"></script>
</body>
</html>
